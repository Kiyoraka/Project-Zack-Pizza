<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlet Login · Zack Pizza</title>
  <meta name="theme-color" content="#E63946">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="dash-login-body">
  <main class="login-card card">
    <div class="login-brand">
      <span class="login-logo">🍕</span>
      <h1>Outlet Dashboard</h1>
      <p class="text-muted">Select your lorry to start your shift.</p>
    </div>

    <form id="outlet-login-form" class="form-section" novalidate>
      <div id="lorry-radio-list" class="lorry-radio-list">
        <p class="text-muted">Loading lorries...</p>
      </div>

      <div class="input-group" style="margin-top:24px">
        <label class="input-label" for="input-pin">Crew PIN</label>
        <input class="input" id="input-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••" required>
      </div>

      <p id="login-error" class="form-error" style="display:none; color: var(--color-primary); margin-top: 12px;"></p>

      <button id="btn-login" type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center; margin-top:16px;">
        Enter Dashboard →
      </button>
    </form>

    <p class="login-helper text-muted" style="margin-top:24px; text-align:center;">
      Need help? Talk to your admin.
    </p>
  </main>

  <nav class="bottom-nav bottom-nav-outlet preview">
    <a class="nav-tab" href="#"><span class="nav-icon" style="font-size:22px">📋</span><span class="nav-label" style="font-size:11px">Orders</span></a>
    <a class="nav-tab" href="#"><span class="nav-icon" style="font-size:22px">🍕</span><span class="nav-label" style="font-size:11px">Products</span></a>
    <a class="nav-tab" href="#"><span class="nav-icon" style="font-size:22px">⚙️</span><span class="nav-label" style="font-size:11px">Settings</span></a>
  </nav>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/outlet-dashboard.js"></script>
</body>
</html>
