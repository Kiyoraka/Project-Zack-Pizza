<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders · Outlet Dashboard · Zack Pizza</title>
  <meta name="theme-color" content="#E63946">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/global-mobile.css">
  <link rel="stylesheet" href="../assets/css/dashboard-mobile.css">
</head>
<body>
  <div class="dash-shell">
    <aside class="dash-sidebar">
      <div class="dash-brand">
        <p class="brand">🍕 ZACK PIZZA</p>
        <p class="text-muted uppercase-micro">Outlet</p>
      </div>
      <nav class="dash-nav">
        <a class="dash-nav-item active" href="orders.html">
          <span class="dash-nav-icon">📋</span>
          <span>Orders</span>
        </a>
        <a class="dash-nav-item" href="products.html">
          <span class="dash-nav-icon">🍕</span>
          <span>Products</span>
        </a>
        <a class="dash-nav-item" href="settings.html">
          <span class="dash-nav-icon">⚙️</span>
          <span>Settings</span>
        </a>
      </nav>
      <button id="btn-logout" class="btn btn-ghost btn-sm" type="button" style="margin-top:auto;">
        ← Logout
      </button>
    </aside>

    <header class="mobile-dash-header">
      <button class="hamburger" type="button" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span class="mobile-dash-title">Orders</span>
      <button id="btn-logout-mobile" class="btn btn-ghost btn-sm" type="button">Logout</button>
    </header>

    <main class="dash-main">
      <header class="dash-header">
        <div>
          <h1 id="outlet-page-name">Orders</h1>
          <p id="outlet-page-subtitle" class="text-muted">—</p>
        </div>
        <div class="dash-header-actions">
          <button id="btn-refresh" class="btn btn-secondary btn-sm" type="button">↻ Refresh</button>
        </div>
      </header>

      <nav id="status-tabs" class="status-tabs">
        <button class="status-tab active" data-status="pending" type="button">⏳ Pending <span class="status-count">0</span></button>
        <button class="status-tab" data-status="preparing" type="button">👨‍🍳 Preparing <span class="status-count">0</span></button>
        <button class="status-tab" data-status="ready" type="button">✅ Ready <span class="status-count">0</span></button>
        <button class="status-tab" data-status="picked-up" type="button">📦 Picked Up <span class="status-count">0</span></button>
        <button class="status-tab" data-status="history" type="button">📜 History <span class="status-count">0</span></button>
      </nav>

      <section id="orders-list" class="orders-list">
        <p class="text-muted">Loading orders...</p>
      </section>
    </main>
  </div>

  <nav class="bottom-nav bottom-nav-outlet">
    <a class="nav-tab active" href="orders.html"><span class="nav-icon" style="font-size:22px">📋</span><span class="nav-label" style="font-size:11px">Orders</span></a>
    <a class="nav-tab" href="products.html"><span class="nav-icon" style="font-size:22px">🍕</span><span class="nav-label" style="font-size:11px">Products</span></a>
    <a class="nav-tab" href="settings.html"><span class="nav-icon" style="font-size:22px">⚙️</span><span class="nav-label" style="font-size:11px">Settings</span></a>
  </nav>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/outlet-dashboard.js"></script>
</body>
</html>
