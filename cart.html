<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart · Zack Pizza</title>
  <meta name="theme-color" content="#E63946">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/customer.css">
  <link rel="stylesheet" href="assets/css/global-mobile.css">
  <link rel="stylesheet" href="assets/css/customer-mobile.css">
</head>
<body>
  <header class="site-header container">
    <a class="brand" href="index.html">🍕 ZACK PIZZA</a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="index.html#menu">Menu</a>
      <a href="index.html#find-us">Find Us</a>
    </nav>
    <a class="btn btn-secondary btn-sm" href="index.html">← Back</a>
    <button class="hamburger" type="button" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main class="cart-page container">
    <h1>Your Cart</h1>
    <p id="cart-outlet-line" class="text-muted">Pickup from <strong id="cart-outlet-name">—</strong></p>

    <section id="cart-items-list" class="cart-items-list">
      <p id="cart-empty-state" class="cart-empty text-muted">
        Your cart is empty. <a href="index.html">Find a lorry</a> to start ordering.
      </p>
    </section>

    <aside class="cart-summary card" id="cart-summary" style="display:none">
      <div class="cart-total-row">
        <span>Subtotal</span>
        <span id="cart-subtotal">RM 0.00</span>
      </div>
      <div class="cart-total-row">
        <span>Pickup</span>
        <span class="text-muted">Free</span>
      </div>
      <div class="cart-total-row cart-total-row-grand">
        <span>Total</span>
        <span id="cart-total">RM 0.00</span>
      </div>
      <a id="proceed-to-checkout" class="btn btn-primary btn-lg" href="checkout.html" style="width:100%; justify-content:center;">
        Proceed to Checkout →
      </a>
      <button id="clear-cart" type="button" class="btn btn-ghost btn-sm" style="width:100%; justify-content:center; margin-top:8px;">
        Clear cart
      </button>
    </aside>
  </main>

  <footer class="site-footer container">
    <div class="footer-brand">
      <p class="brand">🍕 ZACK PIZZA</p>
      <p class="tagline">Hot pizza, fresh wheels</p>
    </div>
    <p class="footer-copy">© 2026 Zack Pizza</p>
  </footer>

  <nav class="bottom-nav">
    <a class="nav-tab" href="index.html">
      <span class="nav-icon" style="font-size:22px">🏠</span>
      <span class="nav-label" style="font-size:11px">Home</span>
    </a>
    <a class="nav-tab" href="index.html#menu">
      <span class="nav-icon" style="font-size:22px">🍕</span>
      <span class="nav-label" style="font-size:11px">Menu</span>
    </a>
    <a class="nav-tab active" href="cart.html">
      <span class="nav-icon" style="font-size:22px">🛒</span>
      <span class="nav-label" style="font-size:11px">Cart</span>
      <span class="nav-cart-badge" id="cart-count-badge" style="display:none">0</span>
    </a>
    <a class="nav-tab" href="#account">
      <span class="nav-icon" style="font-size:22px">👤</span>
      <span class="nav-label" style="font-size:11px">Account</span>
    </a>
  </nav>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    (function () {
      var qs = function (id) { return document.getElementById(id); };
      var fmtPrice = function (n) { return 'RM ' + (Number(n) || 0).toFixed(2); };

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render() {
        var items = Cart.getItems();
        var list = qs('cart-items-list');
        var empty = qs('cart-empty-state');
        var summary = qs('cart-summary');
        var badge = qs('cart-count-badge');
        var outletName = qs('cart-outlet-name');
        var outlet = Cart.getOutlet();

        outletName.textContent = outlet ? (outlet.name + ' — ' + outlet.todayLocation.name) : '—';

        if (!items.length) {
          empty.style.display = '';
          summary.style.display = 'none';
          // Remove any previously-rendered rows
          Array.prototype.forEach.call(list.querySelectorAll('.cart-item-row'), function (el) { el.remove(); });
          badge.style.display = 'none';
          return;
        }
        empty.style.display = 'none';
        summary.style.display = '';

        var rows = items.map(function (it) {
          return '<div class="cart-item-row" data-product-id="' + escapeHtml(it.productId) + '">' +
            '<div class="cart-item-thumb"></div>' +
            '<div class="cart-item-info">' +
              '<h3>' + escapeHtml(it.name) + '</h3>' +
              '<p class="text-muted">' + fmtPrice(it.price) + ' each</p>' +
            '</div>' +
            '<div class="cart-item-qty">' +
              '<button class="qty-btn" data-action="dec" type="button" aria-label="Decrease">−</button>' +
              '<span class="qty-value">' + it.qty + '</span>' +
              '<button class="qty-btn" data-action="inc" type="button" aria-label="Increase">+</button>' +
            '</div>' +
            '<div class="cart-item-subtotal">' + fmtPrice(it.price * it.qty) + '</div>' +
            '<button class="cart-item-remove" type="button" aria-label="Remove">×</button>' +
          '</div>';
        }).join('');

        // Replace any previously-rendered rows
        Array.prototype.forEach.call(list.querySelectorAll('.cart-item-row'), function (el) { el.remove(); });
        list.insertAdjacentHTML('beforeend', rows);

        qs('cart-subtotal').textContent = fmtPrice(Cart.getSubtotal());
        qs('cart-total').textContent = fmtPrice(Cart.getTotal());

        var count = Cart.getCount();
        if (count > 0) {
          badge.textContent = count;
          badge.style.display = '';
        } else {
          badge.style.display = 'none';
        }
      }

      // Event delegation for qty controls + remove
      document.getElementById('cart-items-list').addEventListener('click', function (e) {
        var row = e.target.closest('.cart-item-row');
        if (!row) return;
        var pid = row.getAttribute('data-product-id');

        if (e.target.classList.contains('qty-btn')) {
          var action = e.target.getAttribute('data-action');
          var current = Cart.getItems().filter(function (i) { return i.productId === pid; })[0];
          if (!current) return;
          if (action === 'inc') Cart.updateQty(pid, current.qty + 1);
          if (action === 'dec') Cart.updateQty(pid, current.qty - 1);
        } else if (e.target.classList.contains('cart-item-remove')) {
          Cart.remove(pid);
        }
      });

      document.getElementById('clear-cart').addEventListener('click', function () {
        if (confirm('Clear all items from your cart?')) Cart.clear();
      });

      Cart.onChange(render);
      render();
    })();
  </script>
</body>
</html>
