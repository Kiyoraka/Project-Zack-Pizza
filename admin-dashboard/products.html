<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products · Admin · Zack Pizza</title>
  <meta name="theme-color" content="#E63946">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/global-mobile.css">
  <link rel="stylesheet" href="../assets/css/dashboard-mobile.css">
</head>
<body>
  <div class="dash-shell">
    <aside class="dash-sidebar">
      <div class="dash-brand">
        <p class="brand">🍕 ZACK PIZZA</p>
        <p class="text-muted uppercase-micro">Admin</p>
      </div>
      <nav class="dash-nav">
        <a class="dash-nav-item" href="analytics.html"><span class="dash-nav-icon">📊</span><span>Analytics</span></a>
        <a class="dash-nav-item" href="outlets.html"><span class="dash-nav-icon">🚚</span><span>Outlets</span></a>
        <a class="dash-nav-item active" href="products.html"><span class="dash-nav-icon">🍕</span><span>Products</span></a>
        <a class="dash-nav-item" href="settings.html"><span class="dash-nav-icon">⚙️</span><span>Settings</span></a>
      </nav>
      <button id="btn-logout" class="btn btn-ghost btn-sm" type="button" style="margin-top:auto;">← Logout</button>
    </aside>

    <header class="mobile-dash-header">
      <button class="hamburger" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
      <span class="mobile-dash-title">Products</span>
      <button id="btn-logout-mobile" class="btn btn-ghost btn-sm" type="button">Logout</button>
    </header>

    <main class="dash-main">
      <header class="dash-header">
        <div>
          <h1>Products</h1>
          <p class="text-muted">Shared catalog across all lorries.</p>
        </div>
        <button id="btn-add-product" class="btn btn-primary btn-sm" type="button">+ Add Product</button>
      </header>

      <nav id="category-filter-chips" class="category-tabs"></nav>

      <section class="card" style="padding:0; overflow:hidden;">
        <table class="dash-table">
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <tr><td colspan="6" class="text-muted">Loading products...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="product-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="product-modal-title" class="modal-title">Edit Product</h2>
        <button id="product-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      </header>

      <form id="product-form" novalidate>
        <input type="hidden" id="product-form-id">
        <div class="input-group">
          <label class="input-label" for="product-name">Name</label>
          <input class="input" id="product-name" name="name" type="text" required>
        </div>
        <div class="input-group">
          <label class="input-label" for="product-description">Description</label>
          <input class="input" id="product-description" name="description" type="text">
        </div>
        <div class="form-row" style="display:flex; gap:12px;">
          <div class="input-group" style="flex:1">
            <label class="input-label" for="product-category">Category</label>
            <select class="input" id="product-category">
              <option>Classic</option>
              <option>Signature</option>
              <option>Sides</option>
              <option>Drinks</option>
              <option>Desserts</option>
            </select>
          </div>
          <div class="input-group" style="width:140px">
            <label class="input-label" for="product-price">Price (RM)</label>
            <input class="input" id="product-price" name="price" type="number" min="0" step="0.50" required>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label" for="product-image">Image URL</label>
          <input class="input" id="product-image" name="image" type="text" placeholder="assets/img/products/...">
        </div>
        <label class="payment-option" style="margin-top:12px">
          <input type="checkbox" id="product-available" checked>
          <span class="payment-label">Active in catalog</span>
        </label>

        <button id="btn-save-product" type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center; margin-top:16px;">Save Changes</button>
      </form>
    </div>
  </div>

  <nav class="bottom-nav bottom-nav-admin">
    <a class="nav-tab" href="analytics.html"><span class="nav-icon" style="font-size:22px">📊</span><span class="nav-label" style="font-size:11px">Analytics</span></a>
    <a class="nav-tab" href="outlets.html"><span class="nav-icon" style="font-size:22px">🚚</span><span class="nav-label" style="font-size:11px">Outlets</span></a>
    <a class="nav-tab active" href="products.html"><span class="nav-icon" style="font-size:22px">🍕</span><span class="nav-label" style="font-size:11px">Products</span></a>
    <a class="nav-tab" href="settings.html"><span class="nav-icon" style="font-size:22px">⚙️</span><span class="nav-label" style="font-size:11px">Settings</span></a>
  </nav>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
